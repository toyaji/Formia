name: formia_legacy_import
description: >-
  One-time script that imports legacy (Prisma/SQLite) Form/Deployment/Response
  rows into the Supabase v3 schema via the v2->v3 FormFactorMigrator. See
  docs/flutter_migration/03-backend-supabase.md#7.
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  form_factor:
    path: ../../packages/form_factor
  args: ^2.6.0
  http: ^1.2.2
  uuid: ^4.5.0

dev_dependencies:
  lints: ^6.0.0
