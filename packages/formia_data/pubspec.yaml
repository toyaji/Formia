name: formia_data
description: >-
  Port interfaces + data-layer implementations (Supabase, DTO mapping) for
  Formia. Depends on form_factor + formia_core. No UI dependency.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  formia_core:
    path: ../formia_core
  form_factor:
    path: ../form_factor

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
