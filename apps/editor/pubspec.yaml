name: editor
description: "Formia editor — Flutter web + desktop app (dashboard/builder/AI panel)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1

  formia_core:
    path: ../../packages/formia_core
  form_factor:
    path: ../../packages/form_factor
  formia_data:
    path: ../../packages/formia_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
